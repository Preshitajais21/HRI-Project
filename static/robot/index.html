<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Robot View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/static/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body{background:#0b0f14;color:#e5e7eb;margin:0}
    .topbar{position:sticky; top:0; z-index:10; background:#0b1220; border-bottom:1px solid rgba(255,255,255,.08)}
    .wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 54px);padding:16px}
    .video-frame{width:min(1100px,95vw); aspect-ratio:16/9; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.45); background:#111827; display:flex; align-items:center; justify-content:center}
    video{width:100%;height:100%;object-fit:cover;background:#000}
  </style>
  <style>
    /* 3-way navbar layout that never drifts */
    .nav-three { display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; width:100%; }
    .nav-left  { justify-self:start; }
    .nav-center{ justify-self:center; }
    .nav-right { justify-self:end; }
  </style>

</head>
<body>

  <!-- NAVBAR: title (left) • back button (right) -->
  <nav class="topbar" style="background:#0b1220;border-bottom:1px solid rgba(255,255,255,.08)">
    <div class="container-fluid">
      <div class="nav-three">
        <div class="nav-left">
          <div class="title" style="font-size:16px;font-weight:600;color:#e5e7eb">Robot Camera</div>
        </div>
        <div class="nav-center"><!-- intentionally empty to keep centering --></div>
        <div class="nav-right">
          <a id="backBtn" class="btn btn-outline-primary btn-sm" href="/exp">Back to Experiment</a>
        </div>
      </div>
    </div>
  </nav>



  <main class="wrap">
    <div class="video-frame">
      <video id="robotVideo" autoplay muted loop playsinline controls preload="auto">
        <!-- keep your working source -->
        <source src="/static/robot/videos/moxi1.webm" type="video/webm" />
        <div class="fallback">Your browser does not support HTML5 video.</div>
      </video>
    </div>
  </main>

  <script src="/static/robot/robot.js?v=navbar_row_cols_alignment_v1"></script>
</body>
</html>
